services:
  eventflow-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-efoka24-ops}/eventflow-frontend:${EVENTFLOW_TAG:-latest}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - eventflow-backend
    networks:
      - eventflow-network

  eventflow-backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-efoka24-ops}/eventflow-backend:${EVENTFLOW_TAG:-latest}
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@eventflow-db:5432/${POSTGRES_DB}
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://eventflow.trugroup.cm}
    restart: unless-stopped
    depends_on:
      - eventflow-db
    networks:
      - eventflow-network

  eventflow-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-eventflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eventflow_pass}
      - POSTGRES_DB=${POSTGRES_DB:-eventflow_db}
    volumes:
      - eventflow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - eventflow-network

networks:
  eventflow-network:
    driver: bridge

volumes:
  eventflow_postgres_data:
