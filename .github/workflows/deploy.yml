name: CI + Docker + Deploy (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventflow-frontend:${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/eventflow-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Backend
        run: |
          cp -r database backend/
          docker buildx build \
            --file ./backend/Dockerfile \
            --push \
            --tag ghcr.io/${{ github.repository_owner }}/eventflow-backend:${{ github.run_number }} \
            --tag ghcr.io/${{ github.repository_owner }}/eventflow-backend:${{ github.sha }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "Connected to server"
            whoami
            hostname
            pwd
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            echo "Set image tag (EVENTFLOW_TAG=${{ github.run_number }})"
            touch .env
            if grep -q '^EVENTFLOW_TAG=' .env; then
              sed -i 's/^EVENTFLOW_TAG=.*/EVENTFLOW_TAG=${{ github.run_number }}/' .env
            else
              echo 'EVENTFLOW_TAG=${{ github.run_number }}' >> .env
            fi

            echo "Pull latest images"
            docker compose -p eventflow pull

            echo "Recreate containers"
            docker compose -p eventflow up -d --force-recreate

            echo "Deployment finished"
